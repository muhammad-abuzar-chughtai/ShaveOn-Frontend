<section class="section">
  <div class="container">
    <div class="text-center mb-5">
      <span class="eyebrow">Get In Touch</span>
      <h1 class="mt-2">Contact ShaveOn</h1>
      <p class="text-muted-custom">Questions about a booking or a service? Reach out directly below.</p>
    </div>

    @if (settings(); as s) {
      <div class="row g-4 justify-content-center">
        <div class="col-12 col-md-4">
          <div class="contact-card text-center">
            <i class="fa-solid fa-location-dot contact-icon"></i>
            <h5 class="mt-3">Visit Us</h5>
            <p class="text-muted-custom small mb-0">{{ s.address || 'Address coming soon' }}</p>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="contact-card text-center">
            <i class="fa-solid fa-phone contact-icon"></i>
            <h5 class="mt-3">Call Us</h5>
            <a class="small" [href]="'tel:' + s.contactPhone">{{ s.contactPhone }}</a>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="contact-card text-center">
            <i class="fa-solid fa-envelope contact-icon"></i>
            <h5 class="mt-3">Email Us</h5>
            <a class="small" [href]="'mailto:' + s.contactEmail">{{ s.contactEmail }}</a>
          </div>
        </div>
      </div>
    }

    <div class="text-center mt-5">
      <a routerLink="/book" class="btn btn-primary btn-lg px-4">Book Your Slot</a>
    </div>
  </div>
</section>
